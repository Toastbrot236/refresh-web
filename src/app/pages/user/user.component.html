@if (user) {
    <app-fancy-header [title]="user.username"
                      [description]="user.description | default: user.username + ' hasn\'t introduced themselves yet.'">
        <app-user-avatar [user]="user" [size]="(layout.isMobile | async) ? 90 : 176" avatar></app-user-avatar>
        <ng-container titleSubtext>
            <app-user-role [role]="user.role"></app-user-role>
        </ng-container>
        <div belowTitleRight class="italic text-gentle">
            Joined
            <app-date [date]="user.joinDate"></app-date>
            <br>
        </div>
        <ng-container belowTitle>
            <app-user-status [activeRoom]="user.activeRoom" [lastSeen]="user.lastLoginDate"></app-user-status>
        </ng-container>
        <app-user-statistics [stats]="user.statistics" [ownRelations]="user.ownRelations" statistics></app-user-statistics>
        @if(ownUser && relations && !isMobile) {
            <app-fancy-header-user-buttons [targetUser]="user" [ownUser]="ownUser" [relations]="relations" buttonArea></app-fancy-header-user-buttons>
        }
        @else if(ownUser && relations && isMobile) {
            <app-fancy-header-user-buttons [targetUser]="user" [ownUser]="ownUser" [relations]="relations" buttonAreaMobile></app-fancy-header-user-buttons>
        }
    </app-fancy-header>

    <app-two-pane-layout>
        <app-preview-panel [icon]="faCertificate" title="Levels" [subText]="`(` + 3 + ` in total)`"
            [titleRouterLink]="'/user/' + user.username + '/levels'">

            <!-- Filter -->
            <ng-container toTheRightOfTitle>
                <app-dropdown-radio-button-group groupName="levelCategories" [buttonValues]="[
                    levelCategoryRoutes.ByUser,
                    levelCategoryRoutes.HeartedByUser,
                ]" [textPipe]="levelCategoryPipe" [radioFormField]="levelForm.levelCategory">
                </app-dropdown-radio-button-group>
            </ng-container>

            <!-- Levels -->
            <ng-container content>
                <app-user-level-list [form]="levelForm" [user]="user" [isPreview]="true" />
            </ng-container>

        </app-preview-panel>
        <app-preview-panel [icon]="faImages" title="Photos" [subText]="`(` + 3 + ` in total)`"
            [titleRouterLink]="'/user/' + user.username + '/photos'">

            <!-- Filter -->
            <ng-container toTheRightOfTitle>
                <app-dropdown-radio-button-group groupName="photoCategories" [buttonValues]="[
                    photoCategoryRoutes.ByUser,
                    photoCategoryRoutes.WithUser,
                ]" [textPipe]="photoCategoryPipe" [radioFormField]="photoForm.photoCategory">
                </app-dropdown-radio-button-group>
            </ng-container>

            <!-- Photos -->
            <ng-container content>
                <app-user-photo-list [form]="photoForm" [user]="user" [isPreview]="true" />
            </ng-container>

        </app-preview-panel>
    </app-two-pane-layout>
}
