<app-page-title></app-page-title>

<div>
    <app-textbox [icon]="faEnvelope" [formField]="form.emailAddress" placeholder="sackboy@lbp.me" ctrlName="emailAddress"
        label="Email Address" type="email">
    </app-textbox>
    <app-textbox [icon]="faKey" [formField]="form.passwordClear" placeholder="•••••••••" ctrlName="password"
        label="Password" type="password">
    </app-textbox>

    <app-divider />

    <app-button text="Log In" color="bg-primary" (click)="submit()" />
</div>
