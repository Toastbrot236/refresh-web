<app-page-title></app-page-title>

<form>

</form>
<app-form (submitEvent)="submit($event)">
    <app-textbox [icon]="faEnvelope" [formField]="loginForm.emailAddress" placeholder="sackboy@lbp.me" ctrlName="emailAddress" label="Email Address" type="email"></app-textbox>
    <app-textbox [icon]="faKey" [formField]="loginForm.passwordClear" placeholder="•••••••••" ctrlName="password" label="Password" type="password"></app-textbox>

    <ng-container buttons>
        <app-button action="Log In" color="bg-primary" type="submit" [enabled]="loginForm().valid()"></app-button>
    </ng-container>
</app-form>
